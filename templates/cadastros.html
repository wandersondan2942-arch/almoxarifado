<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro de Usuário - Almoxarifado Valenet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body { min-height: 100vh; background: #f5f6fa; display:flex; align-items:center; justify-content:center; font-family:'Segoe UI',sans-serif; }
        .cadastro-card { width:100%; max-width:480px; border:0; border-radius:18px; box-shadow:0 12px 35px rgba(0,0,0,.10); }
        .logo { width:64px; height:64px; border-radius:16px; display:flex; align-items:center; justify-content:center; margin:0 auto 15px; background:#0d6efd; color:#fff; font-size:28px; }
    </style>
</head>
<body>
<div class="container px-3">
    <div class="card cadastro-card mx-auto">
        <div class="card-body p-4 p-md-5">
            <div class="logo"><i class="fa-solid fa-user-plus"></i></div>
            <h3 class="text-center fw-bold mb-1">Cadastrar usuário</h3>
            <p class="text-center text-muted mb-4">Almoxarifado Valenet</p>

            {% with mensagens = get_flashed_messages(with_categories=true) %}
                {% if mensagens %}
                    {% for categoria, mensagem in mensagens %}
                        <div class="alert alert-{{ categoria }} alert-dismissible fade show" role="alert">
                            {{ mensagem }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('cadastro_usuario') }}" autocomplete="off">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nome</label>
                    <input type="text" name="nome" class="form-control form-control-lg" minlength="2" required autofocus>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Senha</label>
                    <input type="password" name="senha" class="form-control form-control-lg" minlength="4" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Confirmar senha</label>
                    <input type="password" name="confirmar_senha" class="form-control form-control-lg" minlength="4" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100">
                    <i class="fa-solid fa-user-plus me-2"></i>Cadastrar usuário
                </button>
            </form>

            <div class="text-center mt-4">
                <a href="{{ url_for('login') }}" class="text-decoration-none">
                    <i class="fa-solid fa-arrow-left me-1"></i>Voltar para o login
                </a>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
