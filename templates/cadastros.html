<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastros - Almoxarifado Valenet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f5f6fa; font-family: 'Segoe UI', sans-serif; color: #2d3748; }
        .main-content { max-width: 800px; margin: 40px auto; padding: 20px; }
    </style>
</head>
<body>
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold m-0"><i class="fa-solid fa-users-gear text-primary me-2"></i> Cadastros do Sistema</h3>
            <a href="/" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Voltar</a>
        </div>

        <div class="card border-0 shadow-sm p-4">
            <h5 class="fw-bold text-dark mb-3">Equipe Operacional</h5>
            <div class="list-group list-group-flush">
                {% for u in usuarios %}
                <div class="list-group-item d-flex justify-content-between align-items-center py-3">
                    <span class="fw-semibold">{{ u.nome }}</span>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
