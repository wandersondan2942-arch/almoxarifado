<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Atividade - Almoxarifado Valenet</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="mb-1">
                <i class="fa-solid fa-pen-to-square"></i>
                Editar Atividade
            </h2>

            <p class="text-muted mb-0">
                Almoxarifado Valenet
            </p>
        </div>

        <a
            href="{{ url_for('index') }}"
            class="btn btn-outline-secondary"
        >
            <i class="fa-solid fa-arrow-left"></i>
            Voltar
        </a>

    </div>


    {% with mensagens = get_flashed_messages(with_categories=true) %}

        {% if mensagens %}

            {% for categoria, mensagem in mensagens %}

                <div
                    class="alert alert-{{ categoria }} alert-dismissible fade show"
                    role="alert"
                >
                    {{ mensagem }}

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                    ></button>

                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <div class="card shadow-sm border-0">

        <div class="card-header bg-white py-3">

            <h5 class="mb-0">
                <i class="fa-solid fa-list-check"></i>
                Dados da atividade
            </h5>

        </div>


        <div class="card-body">

            <form
                method="POST"
                action="{{ url_for('editar', id=atividade.id) }}"
            >

                <div class="row g-3">


                    <!-- REQUISIÇÃO -->

                    <div class="col-md-4">

                        <label class="form-label">
                            Nº da Requisição
                        </label>

                        <input
                            type="text"
                            name="num_requisicao"
                            class="form-control"
                            value="{{ atividade.num_requisicao or '' }}"
                        >

                    </div>


                    <!-- ATIVIDADE -->

                    <div class="col-md-8">

                        <label class="form-label">
                            Atividade
                        </label>

                        <input
                            type="text"
                            name="atividade"
                            class="form-control"
                            value="{{ atividade.atividade or '' }}"
                            required
                        >

                    </div>


                    <!-- CATEGORIA -->

                    <div class="col-md-4">

                        <label class="form-label">
                            Categoria
                        </label>

                        <select
                            name="categoria"
                            class="form-select"
                            required
                        >

                            <option
                                value="Separação"
                                {% if atividade.categoria == "Separação" %}
                                    selected
                                {% endif %}
                            >
                                Separação
                            </option>

                            <option
                                value="Inventário"
                                {% if atividade.categoria == "Inventário" %}
                                    selected
                                {% endif %}
                            >
                                Inventário
                            </option>

                            <option
                                value="Expedição"
                                {% if atividade.categoria == "Expedição" %}
                                    selected
                                {% endif %}
                            >
                                Expedição
                            </option>

                            <option
                                value="Recebimento"
                                {% if atividade.categoria == "Recebimento" %}
                                    selected
                                {% endif %}
                            >
                                Recebimento
                            </option>

                            <option
                                value="Logística Reversa"
                                {% if atividade.categoria == "Logística Reversa" %}
                                    selected
                                {% endif %}
                            >
                                Logística Reversa
                            </option>

                            <option
                                value="Estoque"
                                {% if atividade.categoria == "Estoque" %}
                                    selected
                                {% endif %}
                            >
                                Estoque
                            </option>

                        </select>

                    </div>


                    <!-- RESPONSÁVEL -->

                    <div class="col-md-4">

                        <label class="form-label">
                            Responsável
                        </label>

                        <select
                            name="responsavel"
                            class="form-select"
                        >

                            {% for usuario in usuarios %}

                                <option
                                    value="{{ usuario.nome }}"
                                    {% if usuario.nome == atividade.responsavel %}
                                        selected
                                    {% endif %}
                                >
                                    {{ usuario.nome }}
                                </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- PRIORIDADE -->

                    <div class="col-md-4">

                        <label class="form-label">
                            Prioridade
                        </label>

                        <select
                            name="prioridade"
                            class="form-select"
                        >

                            <option
                                value="Baixa"
                                {% if atividade.prioridade == "Baixa" %}
                                    selected
                                {% endif %}
                            >
                                Baixa
                            </option>

                            <option
                                value="Média"
                                {% if atividade.prioridade == "Média" %}
                                    selected
                                {% endif %}
                            >
                                Média
                            </option>

                            <option
                                value="Alta"
                                {% if atividade.prioridade == "Alta" %}
                                    selected
                                {% endif %}
                            >
                                Alta
                            </option>

                        </select>

                    </div>


                    <!-- PRAZO -->

                    <div class="col-md-4">

                        <label class="form-label">
                            Prazo
                        </label>

                        <input
                            type="datetime-local"
                            name="prazo"
                            class="form-control"
                            value="{{ atividade.prazo or '' }}"
                        >

                    </div>


                    <!-- STATUS SOMENTE INFORMATIVO -->

                    <div class="col-md-4">

                        <label class="form-label">
                            Status atual
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="{{ atividade.status or 'Pendente' }}"
                            disabled
                        >

                        <small class="text-muted">
                            O status não é alterado nesta tela.
                        </small>

                    </div>


                    <!-- DESCRIÇÃO -->

                    <div class="col-12">

                        <label class="form-label">
                            Descrição
                        </label>

                        <textarea
                            name="descricao"
                            class="form-control"
                            rows="5"
                        >{{ atividade.descricao or '' }}</textarea>

                    </div>

                </div>


                <hr class="my-4">


                <div class="d-flex justify-content-end gap-2">

                    <a
                        href="{{ url_for('index') }}"
                        class="btn btn-secondary"
                    >
                        <i class="fa-solid fa-xmark"></i>
                        Cancelar
                    </a>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        <i class="fa-solid fa-floppy-disk"></i>
                        Salvar alterações
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

</body>
</html>
