<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Almoxarifado Valenet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #1a202c; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; }
        .login-card { width: 100%; max-width: 400px; padding: 30px; border-radius: 12px; background: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <i class="fa-solid fa-boxes-stacked fa-3x text-primary mb-2"></i>
            <h4 class="fw-bold text-dark">Almoxarifado Valenet</h4>
            <small class="text-muted">Acesse o painel operacional</small>
        </div>

        {% if erro %}
        <div class="alert alert-danger py-2 small" role="alert">{{ erro }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label small fw-bold">Nome de Usuário</label>
                <input type="text" name="nome" class="form-control" required placeholder="Ex: Wanderson">
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold">Senha</label>
                <input type="password" name="senha" class="form-control" required placeholder="Sua senha">
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mb-3">Entrar</button>
            <div class="text-center">
                <a href="/cadastro_usuario" class="small text-decoration-none">Não tem conta? Cadastre-se</a>
            </div>
        </form>
    </div>
</body>
</html>
