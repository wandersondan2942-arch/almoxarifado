<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Relatórios - Valenet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { background-color: #f5f6fa; font-family: 'Segoe UI', sans-serif; color: #2d3748; }</style>
</head>
<body class="p-4">
    <div class="container" style="max-width: 1000px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold m-0"><i class="fa-solid fa-chart-pie text-primary me-2"></i> Relatório Geral Consolidado</h4>
            <a href="/" class="btn btn-outline-primary btn-sm fw-bold"><i class="fa-solid fa-arrow-left me-1"></i> Voltar</a>
        </div>
        <div class="card p-4 shadow-sm border-0">
            <table class="table table-striped align-middle" style="font-size: 13px;">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Atividade</th>
                        <th>Categoria</th>
                        <th>Responsável</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    {% for i in itens %}
                    <tr>
                        <td>#{{ i.id }}</td>
                        <td class="fw-semibold">{{ i.atividade }}</td>
                        <td>{{ i.categoria }}</td>
                        <td>{{ i.responsavel }}</td>
                        <td><span class="badge {% if i.status == 'Concluído' %}bg-success{% else %}bg-secondary{% endif %}">{{ i.status }}</span></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
