<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar requisição</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 1000px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1"><i class="fa-solid fa-pen-to-square"></i> Editar atividade</h2>
            <div class="text-muted">Registro #{{ item.id }}</div>
        </div>
        <a href="{{ request.args.get('retorno') or url_for('index') }}" class="btn btn-outline-secondary">
            <i class="fa-solid fa-arrow-left"></i> Voltar
        </a>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <form method="POST">
                <input type="hidden" name="retorno" value="{{ request.args.get('retorno', '') }}">

                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Nº da requisição</label>
                        <input type="text" name="num_requisicao" class="form-control"
                               value="{{ item.num_requisicao or '' }}">
                        <div class="form-text">Não é permitido repetir uma requisição ativa.</div>
                    </div>

                    <div class="col-md-8">
                        <label class="form-label fw-semibold">Atividade</label>
                        <input type="text" name="atividade" class="form-control" required
                               value="{{ item.atividade or '' }}">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Categoria</label>
                        <select name="categoria" class="form-select">
                            {% for opcao in ['Separação', 'Inventário', 'Expedição', 'Recebimento'] %}
                                <option value="{{ opcao }}" {% if item.categoria == opcao %}selected{% endif %}>{{ opcao }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Responsável</label>
                        <select name="responsavel" class="form-select">
                            {% for usuario in usuarios %}
                                <option value="{{ usuario.nome }}" {% if item.responsavel == usuario.nome %}selected{% endif %}>
                                    {{ usuario.nome }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Prioridade</label>
                        <select name="prioridade" class="form-select">
                            {% for opcao in ['Baixa', 'Média', 'Alta'] %}
                                <option value="{{ opcao }}" {% if item.prioridade == opcao %}selected{% endif %}>{{ opcao }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Prazo</label>
                        <input type="datetime-local" name="prazo" class="form-control"
                               value="{{ item.prazo_form or '' }}">
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold">Descrição / observações</label>
                        <textarea name="descricao" class="form-control" rows="6"
                                  placeholder="Ex.: Foi criado um localizador 2345667 para a requisição.">{{ item.descricao or '' }}</textarea>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="{{ request.args.get('retorno') or url_for('index') }}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-floppy-disk"></i> Salvar alterações
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
